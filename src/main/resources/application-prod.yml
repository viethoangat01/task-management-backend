# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

server:
  port: 8082

logging:
  level:
    ROOT: INFO
    com.personal.taskmanagement: INFO

spring:
  config:
    active:
      on-profile: "prod"
  datasource:
    url: jdbc:mariadb://prod-db-host:3306/your_prod_db?useSSL=true&serverTimezone=Asia/Ho_Chi_Minh
    username: prod_user
    password: prod_password
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: HikariCP-Prod
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
