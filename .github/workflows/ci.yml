on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Check Java Style (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest
      - run: chmod +x ./gradlew
      - run: ./gradlew build